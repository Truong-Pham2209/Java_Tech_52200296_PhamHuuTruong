<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Bootstrap CRUD Data Table for Database with Modal Form</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto|Varela+Round">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
	<link rel="stylesheet" href="/style.css">
	<script src="/main.js"></script>
</head>

<body>
	<div class="container-xl">
		<div class="table-responsive">
			<div class="table-wrapper">
				<div class="table-title">
					<div class="row">
						<div class="col-sm-6">
							<h2>Manage <b>Employees</b></h2>
						</div>
						<div class="col-sm-6">
							<a href="/employees/add" class="btn btn-success"><i class="material-icons">&#xE147;</i>
								<span>Add New Employee</span></a>
							<a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal"><i
									class="material-icons">&#xE15C;</i> <span>Delete</span></a>
						</div>
					</div>
				</div>
				<table class="table table-striped table-hover">
					<thead>
						<tr>
							<th>
								<span class="custom-checkbox">
									<input type="checkbox" id="selectAll">
									<label for="selectAll"></label>
								</span>
							</th>
							<th>Name</th>
							<th>Email</th>
							<th>Address</th>
							<th>Phone</th>
							<th>Actions</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="employee : ${employees}">
							<td>
								<span class="custom-checkbox">
									<input type="checkbox" id="checkbox1" name="employee-id" th:value="${employee.id}">
									<label for="checkbox1"></label>
								</span>
							</td>
							<td th:text="${employee.fullname}"></td>
							<td th:text="${employee.email}"></td>
							<td th:text="${employee.address}"></td>
							<td th:text="${employee.phonenumber}"></td>
							<td class="d-flex flex-row">
								<a th:href="@{'/employees/edit/'+${employee.id}}" class="edit"><i class="material-icons"
										data-toggle="tooltip" title="Edit">&#xE254;</i></a>
								<form th:action="@{'/employees/delete/' + ${employee.id}}" method="post">
									<button type="submit" class="border-0">
										<i class="material-icons text-danger" data-toggle="tooltip"
											title="Delete">&#xE872;</i>
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
				<div class="clearfix">
					<div class="hint-text">Showing <b>5</b> out of <b>25</b> entries</div>
					<ul class="pagination">
						<li class="page-item disabled"><a href="#">Previous</a></li>
						<li class="page-item"><a href="#" class="page-link">1</a></li>
						<li class="page-item"><a href="#" class="page-link">2</a></li>
						<li class="page-item active"><a href="#" class="page-link">3</a></li>
						<li class="page-item"><a href="#" class="page-link">4</a></li>
						<li class="page-item"><a href="#" class="page-link">5</a></li>
						<li class="page-item"><a href="#" class="page-link">Next</a></li>
					</ul>
				</div>
			</div>
		</div>
	</div>
	<!-- Delete Modal HTML -->
	<div id="deleteEmployeeModal" class="modal fade">
		<div class="modal-dialog">
			<div class="modal-content">
				<form id="multiDelete" action="/employees/delete/multiple" method="post">
					<div id="idDeletes">

					</div>
					<div class="modal-header">
						<h4 class="modal-title">Delete Employee</h4>
						<button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
					</div>
					<div class="modal-body">
						<p>Are you sure you want to delete these Records?</p>
						<p class="text-warning"><small>This action cannot be undone.</small></p>
					</div>
					<div class="modal-footer">
						<input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
						<input id="btnMultiDelete" type="submit" class="btn btn-danger" value="Delete">
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
<script>
	document.querySelector("input#btnMultiDelete").addEventListener('click', function (e) {
		e.preventDefault()
		const selectedIds = [];
		document.querySelectorAll('input[name="employee-id"]:checked').forEach(checkbox => {
			selectedIds.push(checkbox.value);
		});

		const deleteForm = document.querySelector('#idDeletes');
		deleteForm.innerHTML = ''; // Xóa các input cũ
		selectedIds.forEach(id => {
			const input = document.createElement('input');
			input.type = 'hidden';
			input.name = 'ids';
			input.value = id;
			deleteForm.appendChild(input);
		});

		if (selectedIds.length === 0) {
			alert('Please select at least one record to delete.');
		}
		document.querySelector("form#multiDelete").submit();
	});
</script>

</html>
